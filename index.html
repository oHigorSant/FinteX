<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinteX - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center">
        <div class="row w-100">
            <div class="col-12 col-md-8 col-lg-6 col-xl-4 mx-auto">
                <div class="container-login">
                    <div class="text-center mb-4">
                        <h1 class="logo">
                            <span class="logo-finte">Finte</span><span class="logo-x">X</span>
                        </h1>
                    </div>
                    
                    <div class="secao-login">
                        <h2 class="titulo-login">Login</h2>
                        <p class="descricao-login">Entre com seu email e senha para acessar a sua conta</p>
                        
                        <form>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input 
                                    type="email" 
                                    class="form-control input-personalizado" 
                                    id="email" 
                                    placeholder="email@domínio.com"
                                >
                            </div>
                            
                            <div class="mb-3 posicao-relativa">
                                <label for="senha" class="form-label">Senha</label>
                                <input 
                                    type="password" 
                                    class="form-control input-personalizado" 
                                    id="senha" 
                                    placeholder="***********"
                                >
                                <i class="bi bi-eye alternar-senha" id="alternarSenha"></i>
                            </div>
                            
                            <div class="text-end mb-4">
                                <a href="#" class="link-esqueceu-senha">Esqueceu a senha?</a>
                            </div>
                            
                            <button type="submit" class="btn botao-login w-100 mb-4">
                                Log In
                            </button>
                        </form>
                        
                        <div class="text-center secao-cadastro">
                            <span class="texto-cadastro">Não tem uma conta ? </span>
                            <a href="#" class="link-cadastro">Cadastre-se</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
